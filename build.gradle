import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

application {
    mainClass = 'com.avstreams.merge.AVJoinerAppKt'
}

def platform = "undefined"
def currentOS = org.gradle.internal.os.OperatingSystem.current()

if (currentOS.isWindows()) {
    platform = "win"
} else if (currentOS.isMacOsX()) {
    platform = "mac"
} else if (currentOS.isLinux()) {
    platform = "linux"
} else if (currentOS.isUnix()) {
    platform = "unix"
}

group = 'com.avstreams.merge'
version = "v2.0.0-20261022-${platform}"

repositories {
    mavenCentral()
}

def javaFxVersion = "21"

javafx {
    version = javaFxVersion
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    // Explicit platform classifiers for OpenJFX
    implementation "org.openjfx:javafx-base:${javaFxVersion}:${platform}"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:${platform}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}
